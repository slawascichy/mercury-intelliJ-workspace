mercury.bpm.triggers.integration.dao.bpd.instance=false
mercury.bpm.triggers.integration.dao.task=false
mercury.bpm.triggers.integration=false
mercury.bpm.triggers.system.user=bpmimpl
mercury.bpm.restricted.system.users=bpmimpl, was8, ibm
mercury.bpm.single.mode=true

# Enabling OAuth security for access to REST services
mercury.oauth.filter.enabled=true

# Sample security configuration for CXF services
mercury.ws.security.identifier=mercury
mercury.ws.security.token=SECURITY_TOKEN
mercury.remote.security.enabled=true

# Global parameters of data formats
date.format.default=yyyy-MM-dd
date.format.short=dd-MM-yyyy
date.format.long=dd-MM-yyyy HH:mm:ss XXX
date.format.logger=dd-MM-yyyy HH:mm:ss,SSS z
 
# Attribute cache settings. The values ​​supported are:
#
# 'none' - no use of the cache for attributes
# 'EhCache' - EhCache
#
# The entire list of values ​​is available after using the pro.ibpm.mercury.cache.CacheProviderEnum.values ​​() method;
cache.provider=EhCache
cache.provider.implementation=pl.slawas.common.cache.ehcache.EhCacheProvider
cache.configPath=/opt/mercury-3.0/config/ehcacheDefault.xml
# Default cache duration of items set to one hour:
cache.timeToLive=3600
cache.defaultRegionUsage=false
# Configuration of dynamic caches. DO NOT DELETE! It is very important to
# policy was set to 'none' because cached queries keep active
# database connections and cannot be persisted on DISK, also cannot be used
# 'external' to 'true' because it does not serialize !!
BQueryManager.eternal=false
BQueryManager.maxEntriesLocalHeap=300
BQueryManager.memoryStoreEvictionPolicy=LRU
BQueryManager.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
BQueryManager.strategy.synchronousWrites=false
BQueryManager.timeToIdleSeconds=300

MQueryManager.cache.eternal=false
MQueryManager.cache.maxEntriesLocalHeap=300
MQueryManager.cache.memoryStoreEvictionPolicy=LRU
MQueryManager.cache.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
MQueryManager.strategy.synchronousWrites=false
MQueryManager.cache.timeToIdleSeconds=300

LuceneQueryManager.eternal=false
LuceneQueryManager.maxEntriesLocalHeap=300
LuceneQueryManager.memoryStoreEvictionPolicy=LRU
LuceneQueryManager.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
LuceneQueryManager.strategy.synchronousWrites=false
LuceneQueryManager.timeToIdleSeconds=300

CaseMapper.eternal=false
CaseMapper.maxEntriesLocalHeap=300
CaseMapper.memoryStoreEvictionPolicy=LRU
CaseMapper.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
CaseMapper.strategy.synchronousWrites=false
CaseMapper.timeToIdleSeconds=300

SystemUserCache.eternal=false
SystemUserCache.maxEntriesLocalHeap=600
SystemUserCache.memoryStoreEvictionPolicy=LRU
SystemUserCache.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
SystemUserCache.strategy.synchronousWrites=false
SystemUserCache.timeToIdleSeconds=600

CaseObjectMapCache.eternal=false
CaseObjectMapCache.maxEntriesLocalHeap=10000
CaseObjectMapCache.memoryStoreEvictionPolicy=LRU
CaseObjectMapCache.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
CaseObjectMapCache.strategy.synchronousWrites=false
CaseObjectMapCache.timeToIdleSeconds=600
 
CaseTransactionManager.eternal=false
# maximum number of active external transactions
CaseTransactionManager.maxEntriesLocalHeap=10000
CaseTransactionManager.memoryStoreEvictionPolicy=LRU
CaseTransactionManager.strategy=none
# Persistence: synchronousWrites="true" is not supported with strategy "localTempSwap" or "none"
CaseTransactionManager.strategy.synchronousWrites=false
CaseTransactionManager.timeToIdleSeconds=600
 
cmis.integration=false
