# ------------------------------------------
# Mercury system configuration
# ------------------------------------------
 
# Project version
mercury.version=HGDB_VERSION
mercury.product.name=IBPM Mercury (HgDB)
mercury.license.file=/opt/mercury-3.0/lucene/LicenseKey.txt
mercury.soap.version=3.0
# Setting the language version. At the moment 'en' and 'pl'
mercury.lang=en
mercury.lang.supported=pl,en,ko,pl,de,fr,es
mercury.lang.messages.path=/opt/mercury-3.0/config
# mercury.predefined.resources.path=/opt/mercury-3.0/config
mercury.query.maxHits=10000
mercury.database.dialect=postgresql
mercury.logger.level=INFO

mercury.tomcat.base=true
mercury.view.createAfterTypeChange=true
mercury.case.lastUpdated.scheduler.delay=100
mercury.case.lastUpdated.scheduler.interval=60
# A configuration parameter that tells how the object is to be written
# BPM instance. If it is 'true' and is not empty, then mercury
# will save BPM objects as cases.
mercury.bpm.saveAsCase=true

mercury.lucene.integration=true
mercury.lucene.model.version=3
mercury.lucene.server.role=HGDB_ROLE
mercury.node.name=HGDB_NODE
mercury.node.isClustered=HGDB_IS_CLUSTER
mercury.node.hostname=HOST_NAME
mercury.node.remoteServiceUrl=http://HOST_NAME:8080/mercury-ws-app/remoting
mercury.node.onlineDiff=1000
mercury.node.offlineDiff=5000
mercury.node.heartbeat.intervalSeconds=5
mercury.node.case.role=RW
mercury.node.redirection.cpu.idle=0
mercury.node.highAvailabilityGroup=HGDB_HA_GROUP

mercury.dumperror.data.path=/opt/mercury-3.0/dumpErrors
mercury.upload.file.target=/opt/mercury-3.0/upload

# Repozytorium dokumentów CMIS: lista punktów zamontowania katalogu spraw (po przecinku) i największy rozmiar
# dokumentu w bajtach. Punkt zamontowania nie może być pusty. Brak parametrów: repozytorium "documents", 10 MB.
mercury.cmis.repositories=documents
mercury.cmis.maxContentSize=10485760
# Role uprawnione do repozytorium (po przecinku). Bez wpisu repozytorium jest dostepne dla kazdego uwierzytelnionego
# uzytkownika (obowiazuja uprawnienia do typow spraw).
#mercury.cmis.repositories.documents.roles=
# Uwierzytelnianie CMIS: token Bearer działa zawsze (jak w REST). Dane Basic są sprawdzane w realmie wskazanego
# klienta OAuth; bez parametrów poniżej Basic jest wyłączone. Nie umieszczaj haseł w repozytorium.
#mercury.cmis.security.oauthClientId=
#mercury.cmis.security.oauthClientSecret=

# mercury.workaround.checkUniquenessActiveCaseForProcessInstance.throw.exception=false
# mercury.workaround.case2SubCase.version.default=1
mercury.saveRequestContext.valueIsNullIfFieldNotExisisInRequest.default=false
mercury.saveRequestContext.forceChangeType.default=true
mercury.workaround.index.subcase.correction=true

# Generating/importing data from Excel
excel.server.name=POI_SERVER_NAME
excel.server.description=Server for data read from Excel.
excel.server.version=4.0.5
excel.server.dataDirctory=/opt/mercury-3.0/poi-data
# Communication data with the POI server
excel.server.docUrl=HGDB_WEB_URL/mercury-ws-app/files/downloadPoiFile/
excel.server.port=10090
excel.server.rmi.port=10099
excel.server.host=POI_SERVER_NAME

