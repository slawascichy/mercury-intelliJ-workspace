# JNDI context settings for fetching and working with webProvider, CMIS
schelper.jnp.disableDiscovery=true
# schelper.naming.provider.url=rmi://localhost: 1099
# schelper.naming.factory.url.pkgs=org.jboss.naming: org.jnp.interfaces,
