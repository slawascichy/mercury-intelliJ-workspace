# parametry ustawiane w kontekst Spring
mqConnectionJndiName=jms/ConnectionFactory
mqConnectionReceiveTimeout=20000
mqConnectionPubSubDomain=false

defaultDSjndiName=jdbc/MercuryDB
default.ehcache.configurationResourceName=/opt/mercury-3.0/config/ehcacheDefault.xml
commonDSjndiName=jdbc/MercuryDBCommon
common.ehcache.configurationResourceName=/opt/mercury-3.0/config/ehcacheCommon.xml

hibernate.database=POSTGRESQL
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

hibernate.showSql=false
hibernate.generateDdl=true
# validate | update | create | create-drop
hibernate.hbm2ddl.auto=update
hibernate.mapping.precedence=class
hibernate.bytecode.use_reflection_optimizer=true
hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.ScEhCacheRegionFactory
hibernate.format_sql=false
hibernate.order_updates=true
hibernate.id.new_generator_mappings=true
hibernate.cache.use_query_cache=false
